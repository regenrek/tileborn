name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-fast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-fast:
    name: ci-fast
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      TURBO_SCM_HEAD: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Check forbidden tracked paths
        run: node scripts/security/check-forbidden-paths.mjs --tracked

      - name: Verify JavaScript supply-chain policy
        run: node scripts/security/check-supply-chain-policy.mjs

      - name: Enable Corepack
        run: corepack enable

      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run ci-fast
        run: xvfb-run -a pnpm ci:fast
