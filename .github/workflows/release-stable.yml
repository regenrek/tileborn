name: release-stable

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact 40-character source commit SHA to package
        required: true
        type: string
      version:
        description: Desktop package version that must match apps/desktop/package.json
        required: true
        type: string
      publish_release:
        description: Publish the verified stable bundle after protected environment approval
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-stable-${{ inputs.source_sha }}
  cancel-in-progress: false

jobs:
  stable-candidate:
    name: release-stable-candidate
    runs-on: macos-15
    environment: stable-build-secrets
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      VERSION: ${{ inputs.version }}
      BUNDLE_NAME: tileborne-macos-arm64-stable-${{ inputs.source_sha }}
    steps:
      - name: Validate dispatch inputs
        run: |
          set -euo pipefail
          if [[ ! "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]; then
            echo "source_sha must be an exact lowercase 40-character commit SHA" >&2
            exit 2
          fi
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "version must be stable SemVer from apps/desktop/package.json" >&2
            exit 2
          fi

      - name: Checkout exact source SHA
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0

      - name: Verify checked out SHA and package version
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          PACKAGE_VERSION="$(node -p "require('./apps/desktop/package.json').version")"
          if [[ "$PACKAGE_VERSION" != "$VERSION" ]]; then
            echo "version input $VERSION does not match apps/desktop/package.json $PACKAGE_VERSION" >&2
            exit 2
          fi

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare signing credential file
        env:
          TILEBORNE_APPLE_API_KEY_P8: ${{ secrets.TILEBORNE_APPLE_API_KEY_P8 }}
          TILEBORNE_APPLE_API_KEY_ID: ${{ secrets.TILEBORNE_APPLE_API_KEY_ID }}
        run: |
          set -euo pipefail
          test -n "${TILEBORNE_APPLE_API_KEY_P8:-}"
          test -n "${TILEBORNE_APPLE_API_KEY_ID:-}"
          printf '%s' "$TILEBORNE_APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey_${TILEBORNE_APPLE_API_KEY_ID}.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey_${TILEBORNE_APPLE_API_KEY_ID}.p8"

      - name: Run stable gate profile
        env:
          TILEBORNE_STABLE_GATE_RECEIPT: ${{ runner.temp }}/${{ env.BUNDLE_NAME }}/stable-gate-receipt.json
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/$BUNDLE_NAME"
          node scripts/release-gates.mjs run-profile stable --receipt "$TILEBORNE_STABLE_GATE_RECEIPT"
          node --input-type=module -e "import { readFileSync } from 'node:fs'; import { selectReleaseGates, validateReleaseGateReceipt } from './scripts/release-gates.mjs'; const receipt = JSON.parse(readFileSync(process.env.TILEBORNE_STABLE_GATE_RECEIPT, 'utf8')); validateReleaseGateReceipt(receipt, { profile: 'stable', sourceSha: process.env.SOURCE_SHA, lockfileHash: receipt.lockfileHash, gateIds: selectReleaseGates('stable').map(({ id }) => id), artifactHashes: receipt.artifactHashes });"

      - name: Build retained older signed macOS arm64 candidate
        env:
          TILEBORNE_DESKTOP_RELEASE: '1'
          TILEBORNE_APPLE_SIGNING_IDENTITY: ${{ secrets.TILEBORNE_APPLE_SIGNING_IDENTITY }}
          TILEBORNE_APPLE_TEAM_ID: ${{ secrets.TILEBORNE_APPLE_TEAM_ID }}
          TILEBORNE_APPLE_API_KEY_PATH: ${{ runner.temp }}/AuthKey_${{ secrets.TILEBORNE_APPLE_API_KEY_ID }}.p8
          TILEBORNE_APPLE_API_KEY_ID: ${{ secrets.TILEBORNE_APPLE_API_KEY_ID }}
          TILEBORNE_APPLE_API_ISSUER: ${{ secrets.TILEBORNE_APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          BUNDLE_DIR="$RUNNER_TEMP/$BUNDLE_NAME"
          ORIGINAL_PACKAGE_JSON="$RUNNER_TEMP/desktop-package.original.json"
          cp apps/desktop/package.json "$ORIGINAL_PACKAGE_JSON"
          restore_package_json() {
            cp "$ORIGINAL_PACKAGE_JSON" apps/desktop/package.json
          }
          trap restore_package_json EXIT
          PREVIOUS_VERSION="$(node --input-type=module -e "import { decrementPatchVersion } from './scripts/macos-desktop-release-verifier.mjs'; console.log(decrementPatchVersion(process.env.VERSION));")"
          PREVIOUS_VERSION="$PREVIOUS_VERSION" node --input-type=module -e "import { readFileSync, writeFileSync } from 'node:fs'; const packagePath = 'apps/desktop/package.json'; const manifest = JSON.parse(readFileSync(packagePath, 'utf8')); manifest.version = process.env.PREVIOUS_VERSION; writeFileSync(packagePath, JSON.stringify(manifest, null, 2) + '\n');"
          rm -rf apps/desktop/out/make
          TILEBORNE_SOURCE_COMMIT="$SOURCE_SHA" pnpm --filter @tileborne/desktop package
          PREVIOUS_DMG_COUNT="$(find apps/desktop/out/make -type f -name '*.dmg' | wc -l | tr -d ' ')"
          if [[ "$PREVIOUS_DMG_COUNT" != "1" ]]; then
            echo "expected one retained previous-version DMG, observed $PREVIOUS_DMG_COUNT" >&2
            exit 1
          fi
          PREVIOUS_DMG="$(find apps/desktop/out/make -type f -name '*.dmg' | sort | head -n 1)"
          BUNDLE_PREVIOUS_DMG="$BUNDLE_DIR/retained-previous-$(basename "$PREVIOUS_DMG")"
          cp "$PREVIOUS_DMG" "$BUNDLE_PREVIOUS_DMG"
          restore_package_json
          trap - EXIT
          rm -rf apps/desktop/out/make
          {
            echo "PREVIOUS_VERSION=$PREVIOUS_VERSION"
            echo "BUNDLE_PREVIOUS_DMG=$BUNDLE_PREVIOUS_DMG"
          } >> "$GITHUB_ENV"

      - name: Build signed notarized macOS arm64 stable bundle
        env:
          TILEBORNE_DESKTOP_RELEASE: '1'
          TILEBORNE_APPLE_SIGNING_IDENTITY: ${{ secrets.TILEBORNE_APPLE_SIGNING_IDENTITY }}
          TILEBORNE_APPLE_TEAM_ID: ${{ secrets.TILEBORNE_APPLE_TEAM_ID }}
          TILEBORNE_APPLE_API_KEY_PATH: ${{ runner.temp }}/AuthKey_${{ secrets.TILEBORNE_APPLE_API_KEY_ID }}.p8
          TILEBORNE_APPLE_API_KEY_ID: ${{ secrets.TILEBORNE_APPLE_API_KEY_ID }}
          TILEBORNE_APPLE_API_ISSUER: ${{ secrets.TILEBORNE_APPLE_API_ISSUER }}
        run: TILEBORNE_SOURCE_COMMIT="$SOURCE_SHA" pnpm --filter @tileborne/desktop package

      - name: Assemble verified stable bundle
        env:
          TILEBORNE_APPLE_SIGNING_IDENTITY: ${{ secrets.TILEBORNE_APPLE_SIGNING_IDENTITY }}
          TILEBORNE_APPLE_TEAM_ID: ${{ secrets.TILEBORNE_APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          BUNDLE_DIR="$RUNNER_TEMP/$BUNDLE_NAME"
          DMG_COUNT="$(find apps/desktop/out/make -type f -name '*.dmg' | wc -l | tr -d ' ')"
          ZIP_COUNT="$(find apps/desktop/out/make -type f -name 'Tileborne-darwin-arm64-*.zip' | wc -l | tr -d ' ')"
          if [[ "$DMG_COUNT" != "1" || "$ZIP_COUNT" != "1" ]]; then
            echo "expected one DMG and one darwin arm64 ZIP, observed $DMG_COUNT DMG and $ZIP_COUNT ZIP" >&2
            exit 1
          fi
          DMG="$(find apps/desktop/out/make -type f -name '*.dmg' | sort | head -n 1)"
          ZIP="$(find apps/desktop/out/make -type f -name 'Tileborne-darwin-arm64-*.zip' | sort | head -n 1)"
          MANIFEST="$BUNDLE_DIR/tileborne-desktop-release-manifest.json"
          cp "$DMG" "$BUNDLE_DIR/$(basename "$DMG")"
          cp "$ZIP" "$BUNDLE_DIR/$(basename "$ZIP")"
          BUNDLE_DMG="$BUNDLE_DIR/$(basename "$DMG")"
          BUNDLE_ZIP="$BUNDLE_DIR/$(basename "$ZIP")"
          pnpm release:desktop:manifest \
            --artifact "$BUNDLE_DMG" \
            --update-artifact "$BUNDLE_ZIP" \
            --version "$VERSION" \
            --source-commit "$SOURCE_SHA" \
            --built-at "$(date -u +'%Y-%m-%dT%H:%M:%S.000Z')" \
            --runner-id "github-actions:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}" \
            --signing-authority "$TILEBORNE_APPLE_SIGNING_IDENTITY" \
            --team-id "$TILEBORNE_APPLE_TEAM_ID" \
            --output "$MANIFEST"
          NATIVE_RECEIPT="$BUNDLE_DIR/native-stable-verification-receipt.json"
          UPDATE_RECEIPT="$BUNDLE_DIR/native-stable-update-verification-receipt.json"
          NONCE="$(openssl rand -hex 32)"
          node scripts/macos-desktop-release-verifier.mjs \
            --candidate "$BUNDLE_DMG" \
            --update-artifact "$BUNDLE_ZIP" \
            --nonce "$NONCE" \
            --candidate-only 1 > "$NATIVE_RECEIPT"
          UPDATE_NONCE="$(openssl rand -hex 32)"
          node scripts/macos-desktop-release-verifier.mjs \
            --candidate "$BUNDLE_PREVIOUS_DMG" \
            --update-artifact "$BUNDLE_ZIP" \
            --nonce "$UPDATE_NONCE" > "$UPDATE_RECEIPT"
          node --input-type=module -e "import { readFileSync } from 'node:fs'; const manifest = JSON.parse(readFileSync(process.argv[1], 'utf8')); const currentReceipt = JSON.parse(readFileSync(process.argv[2], 'utf8')); const updateReceipt = JSON.parse(readFileSync(process.argv[3], 'utf8')); const team = process.env.TILEBORNE_APPLE_TEAM_ID; const source = process.env.SOURCE_SHA; const version = process.env.VERSION; const previousVersion = process.env.PREVIOUS_VERSION; const failures = []; if (currentReceipt.nonce !== process.argv[4]) failures.push('current.nonce'); if (updateReceipt.nonce !== process.argv[5]) failures.push('update.nonce'); if (currentReceipt.candidate.candidateArtifactSha256 !== manifest.artifact.sha256) failures.push('current.candidate.sha256'); if (currentReceipt.update.updateArtifactSha256 !== manifest.updateArtifact.sha256 || updateReceipt.update.updateArtifactSha256 !== manifest.updateArtifact.sha256) failures.push('update.sha256'); if (currentReceipt.candidate.embeddedSourceCommit !== source || currentReceipt.update.embeddedSourceCommit !== source || updateReceipt.candidate.embeddedSourceCommit !== source || updateReceipt.update.embeddedSourceCommit !== source) failures.push('source'); if (currentReceipt.candidate.embeddedVersion !== version || currentReceipt.update.embeddedVersion !== version || updateReceipt.update.embeddedVersion !== version) failures.push('current.version'); if (updateReceipt.candidate.embeddedVersion !== previousVersion || updateReceipt.install.sourceVersion !== previousVersion || updateReceipt.install.targetVersion !== version) failures.push('update.version-order'); if (currentReceipt.candidate.candidateTeamIdentifier !== team || currentReceipt.update.updateTeamIdentifier !== team || updateReceipt.candidate.candidateTeamIdentifier !== team || updateReceipt.update.updateTeamIdentifier !== team) failures.push('team'); if (currentReceipt.candidate.candidateStaple !== 'validated' || currentReceipt.update.updateStaple !== 'validated' || updateReceipt.candidate.candidateStaple !== 'validated' || updateReceipt.update.updateStaple !== 'validated') failures.push('staple'); if (currentReceipt.candidate.candidateGatekeeper !== 'accepted' || currentReceipt.update.updateGatekeeper !== 'accepted' || updateReceipt.candidate.candidateGatekeeper !== 'accepted' || updateReceipt.update.updateGatekeeper !== 'accepted') failures.push('gatekeeper'); if (currentReceipt.install.firstLaunchProject.id !== currentReceipt.install.relaunchProject.id || updateReceipt.install.firstLaunchProject.id !== updateReceipt.install.relaunchProject.id) failures.push('relaunch'); if (failures.length > 0) throw new Error('native receipt mismatch: ' + failures.join(', '));" "$MANIFEST" "$NATIVE_RECEIPT" "$UPDATE_RECEIPT" "$NONCE" "$UPDATE_NONCE"
          (cd "$BUNDLE_DIR" && shasum -a 256 ./* > checksums.sha256)
          {
            echo "## release-stable"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Source SHA | $SOURCE_SHA |"
            echo "| Version | $VERSION |"
            echo "| Artifact bundle | $BUNDLE_NAME |"
            echo "| Runner | macos-15 arm64 |"
            echo "| Stable gate receipt | stable-gate-receipt.json |"
            echo "| Retained candidate version | $PREVIOUS_VERSION |"
            echo "| Publication requested | ${{ inputs.publish_release }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload verified stable bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ env.BUNDLE_NAME }}
          path: ${{ runner.temp }}/${{ env.BUNDLE_NAME }}
          if-no-files-found: error
          retention-days: 30

  stable-publication:
    name: release-stable-protected-publication
    runs-on: ubuntu-latest
    needs: stable-candidate
    environment: stable-release
    permissions:
      actions: read
      contents: write
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
      TILEBORNE_DESKTOP_PUBLISH_APPROVED: ${{ secrets.TILEBORNE_DESKTOP_PUBLISH_APPROVED }}
    steps:
      - name: Download verified stable bundle
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release-bundle"
          gh run download "$GITHUB_RUN_ID" \
            --name "tileborne-macos-arm64-stable-$SOURCE_SHA" \
            --dir "$RUNNER_TEMP/release-bundle"
          (cd "$RUNNER_TEMP/release-bundle" && shasum -a 256 -c checksums.sha256)

      - name: Stop before publication unless explicitly requested
        if: ${{ ! inputs.publish_release }}
        run: |
          set -euo pipefail
          {
            echo "## release-stable protected boundary"
            echo
            echo "Stable bundle verified at the protected environment boundary."
            echo "Publication was not requested; no tag or release was created."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create stable GitHub release
        if: ${{ inputs.publish_release }}
        run: |
          set -euo pipefail
          test "$TILEBORNE_DESKTOP_PUBLISH_APPROVED" = "1"
          TAG="desktop-v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release view "$TAG" --json targetCommitish,isPrerelease,isDraft,isLatest,assets > "$RUNNER_TEMP/existing-release.json"
            node --input-type=module -e "import { readFileSync, readdirSync } from 'node:fs'; const release = JSON.parse(readFileSync(process.argv[1], 'utf8')); const bundleDir = process.argv[2]; const source = process.env.SOURCE_SHA; const failures = []; if (release.targetCommitish !== source) failures.push('targetCommitish'); if (release.isPrerelease !== false) failures.push('isPrerelease'); if (release.isDraft !== false) failures.push('isDraft'); const expectedAssets = readdirSync(bundleDir).filter((name) => !name.startsWith('.')).sort(); const actualAssets = (release.assets ?? []).map((asset) => asset.name).sort(); if (JSON.stringify(actualAssets) !== JSON.stringify(expectedAssets)) failures.push('assets'); if (failures.length > 0) throw new Error('existing stable release conflict: ' + failures.join(', '));" "$RUNNER_TEMP/existing-release.json" "$RUNNER_TEMP/release-bundle"
            echo "Existing stable release $TAG already matches $SOURCE_SHA and bundle checksums"
            exit 0
          fi
          gh release create "$TAG" \
            "$RUNNER_TEMP/release-bundle"/* \
            --target "$SOURCE_SHA" \
            --title "Tileborne macOS arm64 stable $VERSION" \
            --notes "Stable release for exact source SHA $SOURCE_SHA. Artifact bundle: tileborne-macos-arm64-stable-$SOURCE_SHA." \
            --latest
