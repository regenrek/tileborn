# Rendered at build time by `tileborne game build --target cloudflare`.
name = "{{SITE_NAME}}"
main = "worker.js"
compatibility_date = "2024-12-01"

[[durable_objects.bindings]]
name = "PLAYTEST_ROOM"
class_name = "PlaytestRoom"

[[services]]
binding = "BEHAVIOR_RUNTIME"
service = "{{SITE_NAME}}-behaviors"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PlaytestRoom"]

[vars]
ROOM_IDLE_TIMEOUT_SECONDS = "60"

# HANDOFF_SIGNING_KEY is a SECRET, never a plaintext var: the worker rejects
# missing, short (< 32 chars), and known-placeholder keys. Set it once before
# the first deploy:
#   wrangler secret put HANDOFF_SIGNING_KEY --config <this file>
