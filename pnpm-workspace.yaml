packages:
  - apps/*
  - packages/*

nodeLinker: hoisted

# Supply-chain quarantine window for newly published dependencies.
minimumReleaseAge: 10080
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
blockExoticSubdeps: true
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 43200
# trustPolicyExclude justification: Effect v4 beta changed from v3 trusted-publisher
# provenance to provenance-only publishing (see c-u9lk); remove when stable for >7 days.
trustPolicyExclude:
  - effect@4.0.0-beta.78
  - '@effect/platform-node@4.0.0-beta.78'
  - '@effect/platform-node-shared@4.0.0-beta.78'
  - '@effect/vitest@4.0.0-beta.78'
dangerouslyAllowAllBuilds: false
savePrefix: ''

overrides:
  '@effect/platform-node': 4.0.0-beta.78
  '@effect/platform-node-shared': 4.0.0-beta.78
  '@effect/vitest': 4.0.0-beta.78
  effect: 4.0.0-beta.78
  msgpackr-extract: 3.0.3
  # @electron/rebuild pulls node-gyp from git; pin to registry for blockExoticSubdeps.
  '@electron/node-gyp': 10.2.0-electron.2
  # Production 1.0 audit hygiene: mature patched transitive pins, kept at the
  # narrowest package names that current upstream ranges can tolerate.
  '@babel/core': 7.29.7
  js-yaml: 4.3.1
  markdown-it: 14.2.0
  nanoid: 3.3.17
  postcss: 8.5.23
  qs: 6.15.2
  sharp: 0.35.3
  svgo: 4.0.2
  tar: 7.5.16
  tmp: 0.2.7
  esbuild: 0.28.1
  'vite@7.3.3': 7.3.5
  'vite@8.0.12': 8.0.16
  'undici@7': 7.29.0
  'undici@8': 8.9.0
  ws: 8.21.0

allowBuilds:
  msgpackr-extract: true
  msw: true
  unrs-resolver: true
  # esbuild postinstall platform binary (game-host worker bundle + CLI cloudflare build).
  esbuild: true
  # wrangler/miniflare workerd native binary for local dev smoke.
  workerd: true
  # wrangler pulls sharp; image tooling not required for game-host CI.
  sharp: false
  # electron@42 postinstall downloads the platform binary (required for Forge).
  electron: true
  # Packaging maker native helpers required by the macOS DMG release path.
  electron-winstaller: false
  fs-xattr: true
  macos-alias: true
